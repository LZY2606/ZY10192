[package]
name = "concordia-crossing"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "concordia-crossing"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tower = "0.5"

[dev-dependencies]
approx = "0.5"
